<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Playlist</title>

    <style>
        body {
            background-color: rgb(204, 204, 204);
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        /* Playlist box */
        .playlist-box {
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
            background-color: rgb(230, 230, 230);
        }

        ul {
            padding: 0;
        }

        li {
            list-style-type: none;
            margin: 10px 0;
        }

        /* Player container */
        .player-container {
            border: 2px solid black;
            border-radius: 10px;
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: rgb(230, 230, 230);
            text-align: center;
        }

        video {
            width: 90%;
            border-radius: 5px;
        }

        audio {
            width: 90%;
            margin-top: 10px;
        }

        p {
            text-align: left;
            margin-left: 5%;
        }
    </style>
</head>

<body>

    <h1>My Playlist</h1>

    <!-- Song List -->
    <div class="playlist-box">
        <ul>
            <li>Song 1</li>
            <li>Song 2</li>
            <li>Song 3</li>
            <li>Song 4</li>
            <li>Song 5</li>
        </ul>
    </div>

    <h2>Now Playing...</h2>

    <div class="player-container">

        <video controls>
            <source src="https://www.w3schools.com/tags/movie.mp4" type="video/mp4">
        </video>

        <h2>MP3 songs</h2>

        <p>Maan Meri Jaan</p>

        <audio controls>
            <source src="https://www.pagalworld.com.se/files/download/id/64630" type="audio/mpeg">
        </audio>

    </div>

</body>
</html>
